<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Tickets - CineBook</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container animate-fade-in">
        <h1 style="margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--glass-border);">My Bookings</h1>
        
        <div th:if="${#lists.isEmpty(tickets)}" style="text-align: center; padding: 5rem 0; color: var(--text-secondary);">
            <div style="font-size: 4rem; opacity: 0.2; margin-bottom: 1rem;">🎫</div>
            <h3>No tickets found</h3>
            <p style="margin-top: 0.5rem; margin-bottom: 2rem;">Looks like you haven't booked any movies yet.</p>
            <a href="/" class="btn">Browse Movies</a>
        </div>

        <div th:unless="${#lists.isEmpty(tickets)}" style="display: flex; flex-direction: column; gap: 1.5rem;">
            <div th:each="ticket : ${tickets}" class="glass-card" style="display: flex; gap: 2rem; align-items: center; position: relative;">
                <img th:src="${ticket.show.movie.posterUrl}" style="width: 100px; height: 150px; object-fit: cover; border-radius: 6px;">
                
                <div style="flex-grow: 1;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                        <div>
                            <h2 th:text="${ticket.show.movie.title}" style="color: var(--primary-color); margin-bottom: 0.2rem;">Movie</h2>
                            <p style="color: var(--text-secondary); font-size: 0.9rem;" th:text="${ticket.show.theater.name}">Theater</p>
                        </div>
                        <div style="text-align: right;">
                            <span style="background: rgba(229, 9, 20, 0.1); color: var(--primary-color); padding: 0.2rem 0.8rem; border-radius: 20px; font-size: 0.8rem; font-weight: 600;">CONFIRMED</span>
                            <div style="margin-top: 0.5rem; color: var(--text-secondary); font-size: 0.8rem;">
                                Booking #<span th:text="${ticket.id}">123</span>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; gap: 3rem; margin-top: 1.5rem; background: rgba(0,0,0,0.2); padding: 1rem; border-radius: 6px;">
                        <div>
                            <div style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase;">Date & Time</div>
                            <div style="font-weight: 600;" th:text="${#temporals.format(ticket.show.showTime, 'dd MMM yyyy, hh:mm a')}">Time</div>
                        </div>
                        <div>
                            <div style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase;">Seats (<span th:text="${#lists.size(ticket.seatNumbers)}">0</span>)</div>
                            <div style="font-weight: 600; color: var(--text-primary);" th:text="${#strings.listJoin(ticket.seatNumbers, ', ')}">A1</div>
                        </div>
                        <div style="margin-left: auto; text-align: right;">
                            <div style="color: var(--text-secondary); font-size: 0.8rem; text-transform: uppercase;">Total Amount</div>
                            <div style="font-weight: 700; font-size: 1.2rem;" th:text="'$' + ${#numbers.formatDecimal(ticket.totalPrice, 1, 2)}">$0.00</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
